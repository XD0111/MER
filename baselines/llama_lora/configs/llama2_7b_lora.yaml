# Llama-2-7B LoRA/QLoRA 指令微调配置
# 说明：如果显存不足，优先使用 use_qlora=true；若有 A100/H100 且想做普通 LoRA，可改为 false。

model_name_or_path: ${LLAMA2_7B_PATH}
train_file: data/processed/train.jsonl
eval_file: data/processed/valid.jsonl
output_dir: outputs/llama2_7b_lora_sft

# 训练长度。法律文本/长案例可以改成 2048 或 4096，但显存开销会上升。
max_seq_length: 2048
packing: false

# QLoRA：4-bit 量化加载 base model，只训练 LoRA adapter。
use_qlora: true
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

# LoRA 参数。简单可跑版本推荐 r=16 或 r=32。
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: none
# Llama 系列常用目标模块。只想更轻量可改成 [q_proj, v_proj]
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# 训练超参数。单卡 24GB 左右通常 batch_size=1 + grad_accum=16 更稳。
num_train_epochs: 3
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
optim: paged_adamw_8bit
max_grad_norm: 0.3
gradient_checkpointing: true
bf16: true
fp16: false
tf32: true

# 日志、验证、保存
logging_steps: 10
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 3
report_to: none
seed: 42
resume_from_checkpoint: null
